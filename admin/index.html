<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fffaf7">
  <title>Мальчик или девочка — управление</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div class="brand">Wedding Vote ✨</div>
      <div class="pill"><span class="dot"></span> Realtime</div>
    </div>

    <section class="hero">
      <h1>Кому сегодня<br>подарят больше?</h1>
      <p>Добавляйте сумму за мальчика или девочку — экран для гостей обновится автоматически.</p>
    </section>

    <section class="grid">
      <article class="card vote-card boy">
        <div class="side-title"><span class="side-icon">👦</span> Мальчик</div>
        <div id="boyTotal" class="total">0</div>
        <div class="currency">сом</div>

        <div class="quick">
          <button class="btn btn-boy" data-side="boy" data-amount="100">+100</button>
          <button class="btn btn-boy" data-side="boy" data-amount="500">+500</button>
          <button class="btn btn-boy" data-side="boy" data-amount="1000">+1 000</button>
          <button class="btn btn-boy" data-side="boy" data-amount="2000">+2 000</button>
          <button class="btn btn-boy" data-side="boy" data-amount="5000">+5 000</button>
          <button class="btn btn-boy" data-side="boy" data-amount="10000">+10 000</button>
        </div>
        <div class="custom-row">
          <input id="boyCustom" class="money-input" inputmode="numeric" type="number" min="1" placeholder="Своя сумма">
          <button class="btn btn-boy" data-custom="boy">Добавить</button>
        </div>
      </article>

      <article class="card vote-card girl">
        <div class="side-title"><span class="side-icon">👧</span> Девочка</div>
        <div id="girlTotal" class="total">0</div>
        <div class="currency">сом</div>

        <div class="quick">
          <button class="btn btn-girl" data-side="girl" data-amount="100">+100</button>
          <button class="btn btn-girl" data-side="girl" data-amount="500">+500</button>
          <button class="btn btn-girl" data-side="girl" data-amount="1000">+1 000</button>
          <button class="btn btn-girl" data-side="girl" data-amount="2000">+2 000</button>
          <button class="btn btn-girl" data-side="girl" data-amount="5000">+5 000</button>
          <button class="btn btn-girl" data-side="girl" data-amount="10000">+10 000</button>
        </div>
        <div class="custom-row">
          <input id="girlCustom" class="money-input" inputmode="numeric" type="number" min="1" placeholder="Своя сумма">
          <button class="btn btn-girl" data-custom="girl">Добавить</button>
        </div>
      </article>
    </section>

    <section class="card section">
      <div class="section-head">
        <h2>Последние внесения</h2>
        <button id="resetAll" class="danger-btn">Сбросить всё</button>
      </div>
      <div id="history" class="history"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script type="module" src="./admin.js"></script>
</body>
</html>
